---
# Lean, single dual-role KRaft node for fast local iteration.
# Replication factor 1, no Cruise Control. Use `dev.sh up --full` for the
# repo's 3-broker examples/kafka topology (Cruise Control, rebalance demos).
#
# Two listeners:
#   secure (9093, TLS + SCRAM, ingress)  -> reached from the HOST by a locally
#                                           run `quarkus:dev` console API
#   plain  (9092, internal, no auth)     -> reached IN-CLUSTER by Kafka Connect
#                                           and by the operator-mode console
#
# The JMX-exporter metrics ConfigMap (console-kafka-metrics) is NOT defined here;
# dev.sh applies examples/kafka/010-ConfigMap-console-kafka-metrics.yaml so the
# lean and full topologies share one copy of the rules.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: console-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - deleteClaim: false
        id: 0
        size: 10Gi
        type: persistent-claim
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: console-kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafka:
    version: 4.2.0
    authorization:
      type: simple
    config:
      allow.everyone.if.no.acl.found: 'true'
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.min.isr: 1
      transaction.state.log.replication.factor: 1
    listeners:
      - name: secure
        port: 9093
        tls: true
        type: ingress
        authentication:
          type: scram-sha-512
        configuration:
          bootstrap:
            host: bootstrap.console-kafka.${CLUSTER_DOMAIN}
            annotations:
              streamshub.github.com/console-listener: 'true'
          brokers:
            - broker: 0
              host: broker-0.console-kafka.${CLUSTER_DOMAIN}
      - name: plain
        port: 9092
        tls: false
        type: internal
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: console-kafka-metrics
          key: kafka-metrics-config.yml
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: console-kafka-user1
  labels:
    strimzi.io/cluster: console-kafka
spec:
  authentication:
    type: scram-sha-512
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: console-topic
  labels:
    strimzi.io/cluster: console-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 7200000
    segment.bytes: 1073741824
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: orders
  labels:
    strimzi.io/cluster: console-kafka
spec:
  partitions: 6
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: payments
  labels:
    strimzi.io/cluster: console-kafka
spec:
  partitions: 3
  replicas: 1
